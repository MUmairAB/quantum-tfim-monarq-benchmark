# NNQS full simulation-track sweep, same L_values and h_grid as
# configs/exact_simulation_sweep.yaml, so every point has a direct exact
# reference. Confirmed empirically (see notebooks/02_nnqs.ipynb and the
# Phase 1 validation run) that alpha=2/n_samples=1024/n_iter=300 holds
# well under the roadmap's 0.1-1% tolerance even at L=24 (0.0000-0.0013%
# error at h=1.0 and h=0.4) — unlike VQE, RBM+MCMC training cost doesn't
# require materializing a 2^L statevector, so it scales cleanly here.
J: 1.0

L_values: [4, 6, 8, 10, 12, 16, 20, 24]

h_grid:
  h_min: 0.0
  h_max: 2.0
  coarse_step: 0.2
  fine_lo: 0.7
  fine_hi: 1.3
  fine_step: 0.05

train:
  alpha: 2
  n_samples: 1024
  n_iter: 300
  learning_rate: 0.02
  diag_shift: 0.01
  seed: 0
