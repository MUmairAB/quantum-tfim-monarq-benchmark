# Seed ensemble for the VQE track.
#
# Every VQE point in results/vqe_sim/ and results/vqe_gpu/ is a single run at
# seed=0. The HVA optimizer lands in different local minima from different
# random initializations, and the spread between seeds is large enough that
# some reported effects need to be checked against it. This config reruns the
# grid over 8 seeds so every number can be quoted as mean +/- std.
#
# n_steps and stepsize are held at the published values (600, 0.1) so the seed
# is the only thing that changes.
#
# Note: these runs will NOT reproduce results/vqe_sim/ exactly. That set was
# produced by the earlier autograd optimizer, before the JAX/optax rewrite;
# the current code reaches a slightly different point for the same seed. This
# ensemble is a new, internally consistent set — compare within it, not
# against the old single-run values.
#
# Blocks are run in order and can be selected with --blocks. See src/vqe_seeds.py.

method: vqe_seed_ensemble
device: lightning.qubit
J: 1.0

seeds: [0, 1, 2, 3, 4, 5, 6, 7]
n_steps: 600
stepsize: 0.1

blocks:
  # The load-bearing L=20 points: the near-critical cliff, and whether depth
  # repairs it. 40 runs, and the deepest circuits here are the slowest in the
  # whole ensemble.
  - name: p1_critical
    L_values: [20]
    h_values: [1.0]
    n_layers_values: [10, 16, 24]

  - name: p1_ferro
    L_values: [20]
    h_values: [0.4]
    n_layers_values: [10, 16]

  # Uncertainty across the rest of the simulation grid at the published depth.
  # 336 runs, but small — seconds at L=4, a few minutes at L=16.
  - name: p2_grid
    L_values: [4, 6, 8, 10, 12, 16]
    h_values: [0.4, 0.8, 0.95, 1.0, 1.05, 1.2, 1.6]
    n_layers_values: [10]

  # L=20 across the same h subset. Expensive; overlaps p1 at h=0.4 and h=1.0,
  # and those runs are skipped as already done.
  - name: p3_L20_h_scan
    L_values: [20]
    h_values: [0.4, 0.8, 0.95, 1.0, 1.05, 1.2, 1.6]
    n_layers_values: [10]

  # The full L=20 depth x h matrix. NOT run by default — it is the expensive
  # tier, and the blocks above already answer the questions the analysis needs.
  # Kept here so the wider scan has a home in this directory rather than a
  # second one: results/vqe_gpu/ is where the original unseeded depth scan
  # lives, but that name describes a GPU run that never happened (those points
  # were computed on CPU), and splitting one ensemble across two directories
  # and two file schemas would make that worse.
  #
  # 168 runs after the overlap with p1 is removed. Far too slow to run one
  # after another, but as a job array with a slot per run it takes roughly as
  # long as its slowest single run. Run it with:
  #   sbatch --array=0-167 --account=def-mahtabs_cpu \
  #       scripts/vqe_seeds_array.sh p4_L20_depth_h_matrix
  - name: p4_L20_depth_h_matrix
    L_values: [20]
    h_values: [0.4, 0.8, 0.95, 1.0, 1.05, 1.2]
    n_layers_values: [16, 20, 24, 30]

  # L=24 — the size the VQE track previously stopped short of, while exact
  # diagonalization and NNQS both reach it. The old cap was default.qubit's
  # backprop keeping a statevector per gate; lightning.qubit's adjoint is O(2^L)
  # regardless of depth and peaks at 2.0 GB here.
  #
  # Three h-values spanning the phase diagram rather than the full seven,
  # because each run takes 6-20 h. Runs via scripts/vqe_L24_array.sh.
  - name: c2_L24
    L_values: [24]
    h_values: [0.4, 1.0, 1.6]
    n_layers_values: [10]
