# VQE (HVA, simulator only) full-L sweep, capped at L=20 — the statevector
# simulator scales with 2^L and L=24 OOMs. h_values kept to the 7-point
# validation subset rather than the full grid to keep L=20 cost manageable.
J: 1.0

L_values: [4, 6, 8, 10, 12, 16, 20]
h_values: [0.4, 0.8, 0.95, 1.0, 1.05, 1.2, 1.6]

train:
  n_layers: 10
  n_steps: 600
  stepsize: 0.1
  seed: 0
