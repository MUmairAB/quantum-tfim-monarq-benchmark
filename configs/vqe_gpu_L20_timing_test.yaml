# Timing/correctness check before the full layer scan in
# vqe_gpu_L20_layer_scan.yaml: confirms no OOM at L=20 and gives a
# per-point time estimate. Single h-value (critical point) across a range
# of layer counts. Filename kept as "vqe_gpu_*" for continuity, though this
# runs on lightning.qubit (CPU) — see src/vqe.py.
method: vqe_lightning_adjoint
device: lightning.qubit
J: 1.0

L_values: [20]
h_values: [1.0]

train:
  n_layers: [16, 20, 24, 30]
  n_steps: 600
  stepsize: 0.1
  seed: 0
